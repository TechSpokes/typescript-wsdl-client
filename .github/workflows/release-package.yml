name: Node.js Package

on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release from (e.g. v0.8.0)"
        required: true

env:
  NODE_VERSION: 24
  NPM_VERSION: 12.0.1

concurrency:
  group: release-state-${{ github.event.release.tag_name || github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      tag: ${{ steps.determine_tag.outputs.tag }}

    steps:
      - name: Determine tag
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using TAG=$TAG"
      - name: Validate tag naming rule
        run: |
          echo "Validating tag: $TAG"
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' does not match required pattern v<major>.<minor>.<patch> (e.g. v0.8.11)"
            exit 1
          fi
        env:
          TAG: ${{ steps.determine_tag.outputs.tag }}

      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.determine_tag.outputs.tag }}
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Use tested npm version
        run: npm install -g npm@${NPM_VERSION}

      - name: Guard package publication state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.determine_tag.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          git fetch --force origin main:refs/remotes/origin/main

          release_json="$(gh release view "${TAG}" --json isDraft,isPrerelease)"
          is_draft="$(jq -r '.isDraft' <<<"${release_json}")"
          is_prerelease="$(jq -r '.isPrerelease' <<<"${release_json}")"
          is_published="false"
          if [[ "${is_draft}" == "false" ]]; then
            is_published="true"
          fi

          node scripts/lib/release-state.mjs guard \
            --tag "${TAG}" \
            --mode package \
            --draft "${is_draft}" \
            --prerelease "${is_prerelease}" \
            --published "${is_published}" \
            --require-main true

      - run: npm ci
      - run: npm run release:publish-check

  publish-npm:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.tag }}

      - name: Use Node.js (npmjs)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/

      - name: Use tested npm version
        run: npm install -g npm@${NPM_VERSION}

      - name: Clear NODE_AUTH_TOKEN for trusted publishing
        run: echo "NODE_AUTH_TOKEN=" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm ci

      - name: Publish to npm (trusted publishing via OIDC)
        run: npm publish --provenance --access public
