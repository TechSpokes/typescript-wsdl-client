name: Product installed qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    name: Installed product (Linux Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:platform
      - run: npm run test:installed
      - name: Standalone conformance
        if: matrix.node == 24
        run: npm run test:conformance
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: linux-node-${{ matrix.node }}-product
          path: tmp/conformance
          if-no-files-found: ignore

  windows:
    name: Installed product (Windows Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:reference
      - run: npm run test:platform
      - run: npm run test:feasibility
      - run: npm run test:installed
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: windows-node-${{ matrix.node }}-product
          path: tmp/conformance
          if-no-files-found: ignore
