name: Product installed qualification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux:
    env:
      npm_config_cache: ${{ github.workspace }}/tmp/cache/npm
    name: Installed product (Linux Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:platform
      - run: npm run test:installed -- --reporter=default --reporter=json --outputFile=tmp/conformance/installed-tests.json
        env:
          NPM_CACHE_RESTORED: ${{ steps.node.outputs.cache-hit }}
      - name: Standalone conformance
        if: matrix.node == 24
        run: npm run test:conformance -- --exclude "test/conformance/reference/**"
      - name: Installed timing evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: linux-node-${{ matrix.node }}-installed-timings
          retention-days: 7
          path: |
            tmp/conformance/installed-tests.json
            tmp/conformance/**/timing.ndjson
            tmp/conformance/**/progress.ndjson
            tmp/conformance/**/result.json
            tmp/conformance/**/context.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: linux-node-${{ matrix.node }}-product
          path: tmp/conformance
          if-no-files-found: ignore

  windows:
    env:
      npm_config_cache: ${{ github.workspace }}/tmp/cache/npm
    name: Installed product (Windows Node ${{ matrix.node }})
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:reference
      - run: npm run test:platform
      - run: npm run test:feasibility
      - run: npm run test:installed -- --reporter=default --reporter=json --outputFile=tmp/conformance/installed-tests.json
        env:
          NPM_CACHE_RESTORED: ${{ steps.node.outputs.cache-hit }}
      - name: Installed timing evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-node-${{ matrix.node }}-installed-timings
          retention-days: 7
          path: |
            tmp/conformance/installed-tests.json
            tmp/conformance/**/timing.ndjson
            tmp/conformance/**/progress.ndjson
            tmp/conformance/**/result.json
            tmp/conformance/**/context.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: windows-node-${{ matrix.node }}-product
          path: tmp/conformance
          if-no-files-found: ignore
