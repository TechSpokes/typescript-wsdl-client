name: Abandon Release Candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Final-form release tag to abandon, for example v1.0.0"
        required: true
        type: string
      reason:
        description: "Permanent reason this candidate must never publish"
        required: true
        type: string
      evidence:
        description: "Optional failed validation run or evidence URL"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-state-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  abandon-release:
    name: Mark candidate permanently abandoned
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Inspect candidate and marker
        id: state
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin
          git fetch --force origin main:refs/remotes/origin/main
          node scripts/lib/release-state.mjs inspect \
            --tag "${TAG}" \
            --require-main true \
            --github-output "${GITHUB_OUTPUT}"

      - name: Require an unpublished draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER_STATE: ${{ steps.state.outputs.marker_state }}
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          set -euo pipefail

          if ! release_json="$(gh release view "${TAG}" --json isDraft,isPrerelease,url 2>/dev/null)"; then
            if [[ "${MARKER_STATE}" != "matching" ]]; then
              echo "Release ${TAG} has no draft and no matching abandonment marker." >&2
              exit 1
            fi
            echo "present=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          is_draft="$(jq -r '.isDraft' <<<"${release_json}")"
          if [[ "${is_draft}" != "true" ]]; then
            echo "Release ${TAG} is already published. Refusing abandonment mutation." >&2
            exit 1
          fi

          echo "present=true" >> "${GITHUB_OUTPUT}"
          echo "url=$(jq -r '.url' <<<"${release_json}")" >> "${GITHUB_OUTPUT}"

      - name: Create immutable abandonment marker
        if: steps.state.outputs.marker_state == 'absent'
        shell: bash
        env:
          COMMIT: ${{ steps.state.outputs.release_commit }}
          EVIDENCE: ${{ inputs.evidence }}
          MARKER: ${{ steps.state.outputs.marker }}
          REASON: ${{ inputs.reason }}
          TAG: ${{ steps.state.outputs.tag }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          message_file="${RUNNER_TEMP}/abandonment-marker.txt"
          {
            echo "Abandon ${TAG}: ${REASON}"
            echo
            echo "Actor: ${ACTOR}"
            echo "Release tag: ${TAG}"
            echo "Marker tag: ${MARKER}"
            echo "Commit: ${COMMIT}"
            if [[ -n "${EVIDENCE}" ]]; then
              echo "Evidence: ${EVIDENCE}"
            fi
          } > "${message_file}"
          git tag -a "${MARKER}" "${COMMIT}" -F "${message_file}"
          git push origin "refs/tags/${MARKER}"

      - name: Verify immutable abandonment marker
        shell: bash
        env:
          COMMIT: ${{ steps.state.outputs.release_commit }}
          MARKER: ${{ steps.state.outputs.marker }}
        run: |
          set -euo pipefail

          git fetch --force origin "refs/tags/${MARKER}:refs/tags/${MARKER}"
          marker_commit="$(git rev-parse --verify "${MARKER}^{commit}")"
          if [[ "${marker_commit}" != "${COMMIT}" ]]; then
            echo "Marker ${MARKER} resolves to ${marker_commit}, expected ${COMMIT}." >&2
            exit 1
          fi

      - name: Retire abandoned draft release
        if: steps.release.outputs.present == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.state.outputs.tag }}
        run: gh release delete "${TAG}" --yes

      - name: Record abandonment summary
        shell: bash
        env:
          COMMIT: ${{ steps.state.outputs.release_commit }}
          MARKER: ${{ steps.state.outputs.marker }}
          REASON: ${{ inputs.reason }}
          RELEASE_PRESENT: ${{ steps.release.outputs.present }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          TAG: ${{ steps.state.outputs.tag }}
        run: |
          {
            echo "## Release candidate abandoned"
            echo
            echo "- Release: ${TAG}"
            echo "- Marker: ${MARKER}"
            echo "- Commit: ${COMMIT}"
            echo "- Reason: ${REASON}"
            if [[ "${RELEASE_PRESENT}" == "true" ]]; then
              echo "- Draft retired: ${RELEASE_URL}"
            else
              echo "- Draft: already absent"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
