name: Release tarball qualification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release-tarball-qualification.yml'
      - 'scripts/qualify-release-tarball.ts'
      - 'scripts/lib/release-tarball.ts'
      - 'scripts/lib/release-state.mjs'
      - 'scripts/validate-npm-package.ts'
      - '.github/workflows/release-package.yml'
      - 'package.json'

permissions:
  contents: read

env:
  NPM_VERSION: 12.0.1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sha256: ${{ steps.bind.outputs.sha256 }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install -g npm@${NPM_VERSION} --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - name: Validate and identify packed bytes
        id: bind
        env:
          RELEASE_TARBALL_DIR: ${{ runner.temp }}/qualified-package
        run: |
          npm run release:publish-check -- --release-tarball
          node scripts/qualify-release-tarball.ts bind
      - uses: actions/upload-artifact@v7
        id: upload
        with:
          name: qualified-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/qualified-package/package.tgz
            ${{ runner.temp }}/qualified-package/package.json
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require exact build outputs before downloading
        shell: bash
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          VALIDATED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$VALIDATED_SHA256" =~ ^[a-f0-9]{64}$ ]]
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/qualified-package
      - name: Use tested npm version
        run: npm install -g npm@${NPM_VERSION} --ignore-scripts --no-audit --no-fund
      - name: Verify the archive and rehearse npm's tarball selection offline
        env:
          NODE_AUTH_TOKEN: ''
          RELEASE_TARBALL_DIR: ${{ runner.temp }}/qualified-package
          VALIDATED_SHA256: ${{ needs.build.outputs.sha256 }}
        shell: bash
        run: |
          node scripts/qualify-release-tarball.ts verify
          manifest="$RELEASE_TARBALL_DIR/package.json"
          package="$(jq -er '.name' "$manifest")"
          report="$(npm publish "$RELEASE_TARBALL_DIR/package.tgz" --ignore-scripts --provenance --access public --dry-run --offline --json)"
          jq -e --arg package "$package" --slurpfile expected "$manifest" \
            '(.[$package] // .) | .name == $expected[0].name and .version == $expected[0].version and .integrity == $expected[0].integrity' <<<"$report"
