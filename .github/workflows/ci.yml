name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  npm_config_cache: ${{ github.workspace }}/tmp/cache/npm
  NODE_USE_SYSTEM_CA: '1'

jobs:
  delivery:
    name: Full delivery (Linux Node 24)${{ github.event_name == 'workflow_dispatch' && ' (manual dispatch)' || '' }}
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  compatibility:
    name: Installed product (${{ matrix.os }}, Node ${{ matrix.node-version }})${{ github.event_name == 'workflow_dispatch' && ' (full)' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24, 26]
        exclude:
          - os: ubuntu-latest
            node-version: 24
    steps:
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run ci:platform
        if: github.event_name != 'workflow_dispatch'
      - run: npm run ci:platform:full
        if: github.event_name == 'workflow_dispatch'
