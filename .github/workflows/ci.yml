name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  npm_config_cache: ${{ github.workspace }}/tmp/cache/npm
  NODE_USE_SYSTEM_CA: '1'

jobs:
  delivery:
    name: Full delivery (Linux Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ci

  compatibility:
    name: Installed product (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [24, 26]
        exclude:
          - os: ubuntu-latest
            node-version: 24
    steps:
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run ci:platform
